<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBR Tiers</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="hero-background">
        <img src="website/images/wallpapers/2025-05-09_21.57.39_edited.png">
        <img src="website/images/wallpapers/midgar.png">
        <img src="website/images/wallpapers/baku.png">
        <img src="website/images/wallpapers/interlagos.png">
        <img src="website/images/wallpapers/RainbowRoadABG2021.png">

    <div class="hero-content">
            <header class="site-header">
                <h1>IBR TIERS</h1>

                <a
                    class="support-link"

                    rel="noopener noreferrer"

            <div class="page-layout">

                        </button>

                            wolfnetwork
                        </button>
                    </nav>


                    <!-- The currently selected board goes here -->
                    <main id="board-container">
                        Loading...
                    </main>
                </div>
                <aside class="ad-sidebar">
                        <script async
                            src="https://www.perchads.com/embed.js"
                            data-space="amdntbkfhp"></script>

            <script src="script.js"></script>
