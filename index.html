<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>IBR Rankings | Minecraft Ice Boat Racing Tiers</title>

    <meta name="description"
        content="Explore Minecraft Ice Boat Racing (IBR) player rankings, competitive tiers, leaderboards and event results across FrostHex, BoatLabs, BRWC and more.">


    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="hero-background">
        <img src="website/images/wallpapers/2025-05-09_21.57.39_edited.png">
        <img src="website/images/wallpapers/midgar.png">
        <img src="website/images/wallpapers/baku.png">
        <img src="website/images/wallpapers/interlagos.png">
        <img src="website/images/wallpapers/RainbowRoadABG2021.png">
    </div>



    <div class="hero-content">
            <header class="site-header">
                <h1>IBR TIERS</h1>

                <a
                    class="support-link"
                    href="https://buymeacoffee.com/Tekad"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ☕ Support the project
                </a>
            </header>


            <div class="page-layout">
                <aside class="sponsor-sidebar">
                    <!-- Room for future sponsors -->
                </aside>

                <div class="rankings-content">
                    <!-- Leaderboard selector -->
                    <nav id="board-selector">
                        <div class="board-group">
                            <span class="board-group-title">Overall</span>
                            <button class="board-button active" data-board="overall">
                                Overall
                            </button>
                        </div>

                        <div class="board-group">
                            <span class="board-group-title">Time Trials</span>
                            <button class="board-button" data-board="tt_all">All Servers</button>
                            <button class="board-button" data-board="tt_frosthex">FrostHex</button>
                            <button class="board-button" data-board="tt_brwc">BRWC</button>
                            <button class="board-button" data-board="tt_bbrl">BBRL</button>
                            <button class="board-button" data-board="tt_boatlabs">BoatLabs</button>
                            <button class="board-button" data-board="tt_frosthexEvent">FrostHex Event</button>
                            <button class="board-button" data-board="tt_wolfnetwork">WolfNetwork</button>
                        </div>

                        <div class="board-group">
                            <span class="board-group-title">Events</span>
                            <button class="board-button" data-board="events_all">All Events</button>
                            <button class="board-button" data-board="events_boatlabs">BoatLabs</button>
                            <button class="board-button" data-board="events_wolfnetwork">WolfNetwork</button>
                        </div>
                    </nav>



                    <!-- The currently selected board goes here -->
                    <main id="board-container">
                        Loading...
                    </main>
                </div>
                <aside class="ad-sidebar">
                        <script async
                            src="https://www.perchads.com/embed.js"
                            data-space="amdntbkfhp"></script>
                    </aside>
        </div>

            <script src="script.js"></script>

    </div>
</body>
</html>
